<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Invoice Tracker</title>
<style>
:root{--bg:#eefaf4;--ink:#0d2a20;--mut:#587068;--card:#fff;--line:#cfe3d9;--g1:#0fa874;--g2:#066b4a;--bal:#066b4a;--ga:rgba(20,184,128,.30);--gb:rgba(20,184,128,.10);--red:#c0281f;--amb:#8a5a00;--gold:linear-gradient(135deg,#fbeaa0,#d9a516 28%,#fff3b8 48%,#c8961a 70%,#8f6a10);box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button,input,select{font:inherit;color:var(--ink)}button{cursor:pointer}
#app{width:100%;max-width:100%;margin:0;min-height:100vh;background:radial-gradient(circle at 92% 12%,rgba(40,210,150,.35),transparent 42%),radial-gradient(circle at 0% 55%,rgba(217,165,22,.18),transparent 38%),var(--bg);padding-bottom:90px;position:relative}
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;padding:16px;border-style:solid;border-width:0 0 4px;border-image:var(--gold) 1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1{margin:0;font-size:20px;font-weight:700}.hd button{min-height:44px;padding:0 16px;background:rgba(255,255,255,.16);border:1.5px solid #e8c24a;color:#fff;border-radius:22px;font-weight:600}
.hd .gear{width:44px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.hd .more-btn{display:inline-flex;align-items:center;gap:5px;padding:0 12px;font-size:14px;flex:none}
.hd-r{display:flex;align-items:center;gap:10px}
.tr{text-align:right;font-weight:600}.tr small{display:block;font-size:12px}.tr b{font-size:20px;color:#ffe58a}
main{padding:14px 16px}
.mod{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;height:68px;padding:8px 16px;margin-bottom:10px;border-radius:18px;border:2px solid transparent;background:linear-gradient(165deg,var(--g1),var(--g2)) padding-box,var(--gold) border-box;color:#fff;text-align:left}
.mod::after{content:"";position:absolute;left:-30%;top:-60%;width:160%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0));transform:rotate(-8deg);pointer-events:none}
.ic{position:relative;z-index:1;flex:none;width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:linear-gradient(#08865c,#08865c) padding-box,var(--gold) border-box;display:flex;align-items:center;justify-content:center}
.mod span{position:relative;z-index:1}.mod b{font-size:18px;display:block}.mod small{font-size:13px;font-weight:600;color:#e6fff3}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bal);margin:16px 0 10px;padding-bottom:5px;border-style:solid;border-width:0 0 2px;border-image:var(--gold) 1}
.ac{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border-radius:22px;border:1.5px solid rgba(15,168,116,.5);background:linear-gradient(135deg,var(--ga),var(--gb));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 22px rgba(6,107,74,.2),inset 0 1px 0 rgba(255,255,255,.8)}
.av{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:linear-gradient(145deg,var(--g1),var(--g2)) padding-box,var(--gold) border-box;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.ac .nm{flex:1}.ac small{display:block;color:var(--mut);font-size:13px}.amt{font-weight:700;font-size:17px;text-align:right}
.iv{position:relative;overflow:hidden;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.iv::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:6px}.ih b{font-size:16px}.ih small{margin-left:auto;color:var(--mut);font-size:12px}
.sl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.bl{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.bl span{font-size:13px;font-weight:700;color:var(--ink)}.bl strong{font-size:26px;line-height:1.1;color:var(--bal)}.bl .red{color:var(--red)}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;border:1px solid #FCA5A5;background:#FEE2E2;color:#991B1B}
.tag.o,.tag.u{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.tag.p{background:#FEF9C3;color:#854D0E;border-color:#FDE047}
.tag.d{background:#DCFCE7;color:#166534;border-color:#86EFAC}
.btn{display:block;width:100%;min-height:50px;border-radius:14px;border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--gold) border-box;color:var(--bal);font-weight:700;margin:8px 0}
.btn.f{background:linear-gradient(160deg,var(--g1),var(--g2)) padding-box,var(--gold) border-box;color:#fff}
.btn.danger{border:2px solid var(--red);background:var(--card);color:var(--red)}
.btn.sm{width:auto;min-height:38px;padding:0 12px;font-size:13px;margin:0;border-radius:10px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.sum div{padding:10px 14px;border-radius:16px;border:1.5px solid rgba(15,168,116,.5);background:linear-gradient(135deg,var(--ga),var(--gb))}.sum small{display:block;color:var(--mut);font-size:13px}.sum b{font-size:19px}
label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:0 0 12px}
input,select{display:block;width:100%;min-height:48px;margin-top:5px;padding:0 12px;border:2px solid var(--g2);border-radius:12px;background:#fff;font-size:16px;font-weight:600;box-shadow:0 2px 6px rgba(6,107,74,.15)}input:focus,select:focus{outline:none;border-color:#d9a516;box-shadow:0 0 0 3px rgba(217,165,22,.35)}
.row{display:flex;gap:8px;align-items:flex-end}.row>label{flex:1;margin:0}.row .btn{width:auto;padding:0 14px;margin:0;font-size:14px}
#al{position:absolute;left:16px;right:16px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.2);display:none;overflow:hidden}
#al button{display:block;width:100%;min-height:46px;text-align:left;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:none}#al p{margin:0;padding:12px 14px;color:var(--mut);font-size:14px}
.note{padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,var(--ga),var(--gb));font-size:13px;margin:0 0 12px}
.note.warn{border:1px solid #c8961a;background:rgba(251,234,160,.45)}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));min-height:56px;padding:0 22px;border-radius:28px;border:2px solid transparent;background:linear-gradient(160deg,var(--g1),var(--g2)) padding-box,var(--gold) border-box;color:#fff;font-weight:700;box-shadow:0 10px 22px rgba(6,80,58,.4);z-index:4}
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto}
.modal-bg{position:fixed;inset:0;z-index:20;background:rgba(13,42,32,.48);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.modal-card{width:100%;max-width:410px;background:var(--bg);border-radius:22px;border:2px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--gold) border-box;padding:18px 16px 12px;box-shadow:0 16px 36px rgba(6,80,58,.35)}
.modal-card h3{margin:0 0 12px;font-size:17px;color:var(--bal);text-align:center}
.sh{width:100%;max-width:100%;margin:0;min-height:100%;background:radial-gradient(circle at 92% 6%,rgba(40,210,150,.3),transparent 40%),var(--bg);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sh .hd{margin:0 -16px 14px}
.ph{height:230px;border-radius:12px;background:#e9ecea;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden;position:relative}
.ph.zoomable{cursor:zoom-in}
.ph-hint{position:absolute;right:8px;bottom:8px;background:rgba(13,42,32,.72);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;pointer-events:none}
.zoom-ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);display:flex;flex-direction:column}
.zoom-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:#fff;gap:8px;flex:none}
.zoom-bar button{min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid #e8c24a;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:14px}
.zoom-stage{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative}
.zoom-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
.ph img{width:100%;height:100%;object-fit:contain}
.pp{width:46%;height:92%;background:#fff;transform:rotate(-3deg);box-shadow:0 4px 12px rgba(0,0,0,.25);padding:8px;color:#333;font-size:9px}.pp i{display:block;height:4px;background:#c9cfcc;margin:5px 0}.pp u{display:block;text-align:right;font-weight:700;margin-top:8px}
.dl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:15px;border-bottom:1px solid var(--line)}.dl.s{font-size:13px;color:var(--mut)}
.rm-btn{min-height:36px;padding:0 10px;border:1px solid var(--red);border-radius:8px;background:none;color:var(--red);font-size:12px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:22px 0}
.st{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:16px 6px 8px;margin-top:4px}.st::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--gold)}
.st h3{margin:0;text-align:center;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--bal)}.st .sub{text-align:center;font-size:13px;color:var(--mut);margin:2px 0 10px}
.soa-tbl{table-layout:fixed;width:100%;border-collapse:collapse;font-size:11px}
.soa-tbl thead th{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;font-weight:700;padding:8px 3px;text-align:left;font-size:11px}
.soa-tbl thead th.n,.soa-tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.soa-tbl tbody tr.soa-row{cursor:pointer;border-bottom:1px solid #d5e6dd}
.soa-tbl tbody tr.soa-row:nth-child(odd){background:#fff}
.soa-tbl tbody tr.soa-row:nth-child(even){background:#f6fbf8}
.soa-tbl tbody tr.soa-row:active{background:#dff4ea}
.soa-tbl td{padding:8px 3px;vertical-align:middle}
.soa-tbl td.det{overflow-wrap:anywhere}
.soa-tbl td b{font-size:12px;display:block}
.soa-tbl td small{display:block;color:var(--mut);font-size:11px}
.soa-tbl td.g{color:var(--bal);font-weight:700}
.soa-tbl td.bb{font-weight:700;font-size:11.5px}
.soa-tbl td.chev{text-align:right;color:var(--mut);font-weight:700;font-size:14px;padding:8px 2px 8px 0}
.soa-tbl tfoot td{font-weight:700;font-size:11.5px;border-top:2px solid var(--g2);padding:9px 3px 4px;background:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:70}
.splash{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--g1),var(--g2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .38s ease}
.splash.out{opacity:0;pointer-events:none}
.splash-card{width:116px;height:116px;border-radius:28px;background:#fff;border:3px solid #e8c24a;box-shadow:0 16px 36px rgba(0,0,0,.28);padding:14px;display:flex;align-items:center;justify-content:center;animation:splashPulse 1.2s ease-in-out infinite alternate}
.splash-card img{width:100%;height:100%;object-fit:contain;border-radius:16px}
.splash-title{color:#fff;font-size:22px;font-weight:700;letter-spacing:.02em;animation:splashFade .5s ease-out both}
.splash-ver{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));color:rgba(255,255,255,.85);font-size:13px;font-weight:600;letter-spacing:.04em}
.rec-row{display:flex;align-items:stretch;gap:8px;margin-bottom:10px}
.rec-row .ac{flex:1;margin-bottom:0}
.rec-share{flex:none;align-self:center;min-height:44px;padding:0 12px}
@keyframes splashFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashPulse{from{transform:scale(.95);opacity:.92}to{transform:scale(1.03);opacity:1}}
.lock-ov{position:fixed;inset:0;z-index:50;background:linear-gradient(165deg,var(--g1),var(--g2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;overflow:auto}
.lock-box{width:100%;max-width:340px;text-align:center}
.lock-box h2{color:#ffe58a;border:0;margin:0 0 6px;font-size:15px}
.lock-sub{color:#e6fff3;font-size:14px;margin:0 0 18px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:14px 0 12px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #e8c24a;background:transparent;transition:background .15s}
.pin-dot.on{background:#ffe58a}
.pin-err{min-height:20px;font-size:13px;color:#ffd0cc;font-weight:600;margin:4px 0 10px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 14px}
.pin-key{height:60px;border-radius:18px;border:1.5px solid rgba(232,194,74,.75);background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pin-key:active{background:rgba(255,255,255,.30)}
.pin-key.sm{font-size:14px}
.lock-link{background:none;border:0;color:#ffe58a;font-size:14px;font-weight:600;text-decoration:underline;padding:8px 12px}
.lock-card{background:var(--bg);color:var(--ink);border-radius:20px;border:2px solid #e8c24a;padding:18px 16px;text-align:left}
</style>
</head>
<body>
<div id="splash" class="splash"><div class="splash-card"><img src="icon-512.png" alt="Invoice Tracker"></div><div class="splash-title">Invoice Tracker</div><div class="splash-ver" id="splash-ver">v1.1.0</div></div>
<div id="app"><p class="empty">Loading...</p></div>
<div id="toast" role="status"></div>
<script>
const DB_NAME = 'invoice_tracker_db';
const DB_VER = 1;
const APP_VERSION = 'v1.1.0';
const DEFAULT_MODEL = 'qwen/qwen3.8-27b';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('accounts')) {
        const s = d.createObjectStore('accounts', { keyPath: 'id', autoIncrement: true });
        s.createIndex('name', 'name', { unique: false });
      }
      if (!d.objectStoreNames.contains('invoices')) {
        const s = d.createObjectStore('invoices', { keyPath: 'id', autoIncrement: true });
        s.createIndex('accountId', 'accountId', { unique: false });
        s.createIndex('dueDate', 'dueDate', { unique: false });
        s.createIndex('invoiceDate', 'invoiceDate', { unique: false });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function dbAdd(store, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).add(obj);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(obj);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function loadInvoiceSummaries() {
  return new Promise((resolve, reject) => {
    const list = [];
    const tx = db.transaction('invoices', 'readonly');
    const req = tx.objectStore('invoices').openCursor();
    req.onsuccess = e => {
      const cur = e.target.result;
      if (!cur) return resolve(list);
      const v = cur.value;
      list.push({
        id: v.id,
        accountId: v.accountId,
        number: v.number,
        invoiceDate: v.invoiceDate,
        dueDate: v.dueDate,
        amountSen: v.amountSen,
        payments: Array.isArray(v.payments) ? v.payments : [],
        hasPhoto: !!v.photoDataUrl,
        createdAt: v.createdAt || ''
      });
      cur.continue();
    };
    req.onerror = () => reject(req.error);
  });
}

async function loadSettings() {
  const rows = await dbGetAll('settings');
  const map = {
    groqApiKey: '', groqModel: DEFAULT_MODEL, lastBackupAt: '', weeklyReminderDismissedAt: '',
    lockEnabled: false, pinHash: '', bioEnabled: false, secQuestion: '', secAnswerHash: ''
  };
  rows.forEach(r => { if (r && r.key) map[r.key] = r.value; });
  if (!map.groqModel) map.groqModel = DEFAULT_MODEL;
  return map;
}

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(str)));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function saveSetting(key, value) {
  CFG[key] = value;
  await dbPut('settings', { key, value });
}

// Live local date helpers
const todayDate = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const off = o => { const d = todayDate(); d.setDate(d.getDate() + o); return fd(d); };
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = s => {
  if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return String(s || '');
  const [y, m, d] = s.split('-');
  return String(+d).padStart(2, '0') + ' ' + MO[m - 1] + ' ' + y;
};
const show = fmtDate;
const sd = fmtDate;
const addDays = (s, n) => {
  const base = isValidDateStr(s) ? new Date(s + 'T00:00') : todayDate();
  base.setDate(base.getDate() + n);
  return fd(base);
};
const days = s => Math.round((new Date(s + 'T00:00') - todayDate()) / 864e5);
const isValidDateStr = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00').getTime());

// Integer sen math helpers
const toSen = v => {
  const s = String(v ?? '').trim();
  if (!s) return NaN;
  const n = Number(s);
  if (!Number.isFinite(n)) return NaN;
  return Math.round(n * 100);
};
const rm = sen => 'RM ' + (sen / 100).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nFmt = sen => (sen / 100).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);

// App state
let A = [];
let I = [];
let CFG = {
  groqApiKey: '', groqModel: DEFAULT_MODEL, lastBackupAt: '', weeklyReminderDismissedAt: '',
  lockEnabled: false, pinHash: '', bioEnabled: false, secQuestion: '', secAnswerHash: ''
};
let S = {
  v: 'home', acc: null, q: '', exp: {},
  sheet: null, sheetPhoto: null,
  zoomOpen: false, zoomScale: 1, zoomX: 0, zoomY: 0,
  editInv: false, confirmDelInv: null, confirmDelPay: null,
  editAcc: false, confirmDelAcc: false,
  showKey: false, setDraft: null, verifying: false, groqModels: [],
  photoPrompt: null, scanning: false,

const paidSen = i => i.payments.reduce((t, p) => t + p.amountSen, 0);
const balSen = i => Math.max(0, i.amountSen - paidSen(i));
const st = i => balSen(i) <= 0 ? 'd' : days(i.dueDate) < 0 ? 'o' : paidSen(i) > 0 ? 'p' : 'u';
const TAG = { d: 'Paid', o: 'Overdue', p: 'Partly paid', u: 'Unpaid' };
const mine = aId => I.filter(i => i.accountId === aId);
const open = aId => mine(aId).filter(i => balSen(i) > 0);
const dueSen = aId => open(aId).reduce((t, i) => t + balSen(i), 0);
const acc = id => A.find(a => a.id === id);

const toast = t => {
  const e = $('#toast');
  e.textContent = t;
  e.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { e.style.display = 'none'; }, 2400);
};

const ini = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const dueTxt = i => {
  const d = days(i.dueDate);
  if (balSen(i) <= 0) return 'Paid in full';
  if (d < 0) return (-d) + (d === -1 ? ' day' : ' days') + ' overdue';
  if (d === 0) return 'Due today';
  if (d === 1) return 'Due in 1 day';
  return 'Due in ' + d + ' days';
};

function shouldShowBackupReminder() {
  if (A.length === 0 && I.length === 0) return false;
  const now = Date.now();
  const weekMs = 7 * 864e5;
  if (CFG.weeklyReminderDismissedAt && (now - new Date(CFG.weeklyReminderDismissedAt).getTime()) < weekMs) return false;
  if (CFG.lastBackupAt) return (now - new Date(CFG.lastBackupAt).getTime()) >= weekMs;
  const oldestInv = I.reduce((min, i) => (i.createdAt && (!min || i.createdAt < min)) ? i.createdAt : min, '');
  if (!oldestInv) return false;
  return (now - new Date(oldestInv).getTime()) >= weekMs;
}

function getDayReportData(dateStr) {
  const ev = [];
  I.forEach(i => {
    if (i.invoiceDate <= dateStr) {
      ev.push({ d: i.invoiceDate, k: 0, order: i.createdAt || String(i.id).padStart(8, '0'), i });
    }
    i.payments.forEach((p, idx) => {
      if (p.date <= dateStr) {
        ev.push({ d: p.date, k: 1, order: p.id || String(idx).padStart(4, '0'), i, a: p.amountSen });
      }
    });
  });
  ev.sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : x.k !== y.k ? x.k - y.k : x.order < y.order ? -1 : x.order > y.order ? 1 : 0);

  const runBal = {};
  const newDues = [];
  const prevPaid = [];

  ev.forEach(e => {
    const aid = e.i.accountId;
    const prev = runBal[aid] || 0;
    const delta = e.k ? -e.a : e.i.amountSen;
    const curr = prev + delta;
    runBal[aid] = curr;
    if (e.d === dateStr) {
      const a = acc(aid);
      const accountName = a ? a.name : 'Unknown';
      if (e.k === 0) {
        newDues.push({ invoiceId: e.i.id, invoiceNo: e.i.number, accountName, prevSen: prev, amtSen: e.i.amountSen, currSen: curr });
      } else {
        prevPaid.push({ invoiceId: e.i.id, invoiceNo: e.i.number, accountName, prevSen: prev, amtSen: e.a, currSen: curr });
      }
    }
  });

  const newDueTotalSen = newDues.reduce((t, x) => t + x.amtSen, 0);
  const prevPaidTotalSen = prevPaid.reduce((t, x) => t + x.amtSen, 0);
  const totalDueNowSen = Object.values(runBal).reduce((t, v) => t + Math.max(0, v), 0);
  return { dateStr, newDues, newDueTotalSen, prevPaid, prevPaidTotalSen, totalDueNowSen };
}

function buildDayReportText(dStr) {
  const { newDues, newDueTotalSen, prevPaid, prevPaidTotalSen, totalDueNowSen } = getDayReportData(dStr);
  const newLines = newDues.length
    ? newDues.map(x => `• ${x.accountName}: ${rm(x.prevSen)} + ${rm(x.amtSen)} = ${rm(x.currSen)} (${x.invoiceNo})`)
    : ['• None'];
  const paidLines = prevPaid.length
    ? prevPaid.map(x => `• ${x.accountName}: ${rm(x.prevSen)} - ${rm(x.amtSen)} = ${rm(x.currSen)} (${x.invoiceNo})`)
    : ['• None'];
  return [

function compressImageSource(src, maxSide = 1400, quality = 0.75, revoke = false) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      if (revoke) URL.revokeObjectURL(src);
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      const maxDim = Math.max(w, h);
      if (maxDim > maxSide) {
        const scale = maxSide / maxDim;
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { if (revoke) URL.revokeObjectURL(src); reject(new Error('Invalid image')); };
    img.src = src;
  });
}

function compressImageFile(file, maxSide = 1400, quality = 0.80) {
  return compressImageSource(URL.createObjectURL(file), maxSide, quality, true);
}

async function runGroqOCR(ocrDataUrl) {
  const apiKey = (CFG.groqApiKey || '').trim();
  const model = (CFG.groqModel || DEFAULT_MODEL).trim() || DEFAULT_MODEL;

  if (!apiKey) {
    S.d.scanNote = 'No Groq API key set. Photo saved — add your key in Settings or enter details manually.';
    return;
  }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    S.d.scanNote = 'No internet connection. Photo saved — please enter the details manually.';
    return;
  }

  const base64Data = ocrDataUrl.split(',')[1] || '';
  const url = 'https://api.groq.com/openai/v1/chat/completions';
  const promptText = 'Extract invoice_no, invoice_date (YYYY-MM-DD), due_date (YYYY-MM-DD), and amount (number only). Never extract account/supplier name. Return valid JSON only.';

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model,
        temperature: 0.1,
        response_format: { type: 'json_object' },
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: promptText },
            { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + base64Data } }
          ]
        }]
      }),
      signal: ctrl.signal
    });

    if (!res.ok) {
      if (res.status === 401 || res.status === 403) {
        S.d.scanNote = 'Invalid Groq API key. Photo saved — check Settings or enter details manually.';
      } else if (res.status === 429) {
        S.d.scanNote = 'Groq rate limit reached. Photo saved — enter details manually.';
      } else {
        S.d.scanNote = `Scan failed (HTTP ${res.status}). Photo saved — enter details manually.`;
      }
      return;
    }

    const body = await res.json();
    let txt = body?.choices?.[0]?.message?.content || '';
    txt = txt.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
    const parsed = JSON.parse(txt);

    // Safe field auto-fill: NEVER touch S.d.acc; only populate non-null/non-empty fields
    if (parsed.invoice_no !== null && parsed.invoice_no !== undefined && String(parsed.invoice_no).trim()) {
      S.d.no = String(parsed.invoice_no).trim();
    }
    if (parsed.invoice_date !== null && parsed.invoice_date !== undefined && isValidDateStr(String(parsed.invoice_date).trim())) {
      S.d.iss = String(parsed.invoice_date).trim();
    }
    if (parsed.due_date !== null && parsed.due_date !== undefined && isValidDateStr(String(parsed.due_date).trim())) {
      S.d.due = String(parsed.due_date).trim();
    } else if (!S.d.due) {
      S.d.due = off(1);
    }
    if (parsed.amount !== null && parsed.amount !== undefined && String(parsed.amount).trim() !== '') {
      const cleanAmount = String(parsed.amount).replace(/,/g, '').replace(/[^0-9.\-]/g, '');
      const parsedNum = parseFloat(cleanAmount);
      const sen = Number.isFinite(parsedNum) ? Math.round(parsedNum * 100) : NaN;
      if (Number.isFinite(sen) && sen > 0) {
        S.d.amt = (sen / 100).toFixed(2);
      }
    }
    S.d.scanNote = 'Invoice number, dates and amount were filled from the photo. Please check them. The account is never read from the photo, so choose it above.';
  } catch (err) {
    if (err && err.name === 'AbortError') {
      S.d.scanNote = 'Scan timed out. Photo saved — please enter the details manually.';
    } else {
      S.d.scanNote = 'Could not read the invoice automatically. Photo saved — enter details manually.';
    }
  } finally {
    clearTimeout(timer);
  }
}

async function fetchGroqModels(apiKey) {
  const key = (apiKey || '').trim();
  if (!key) return { ok: false, msg: 'Enter your Groq API key first.', models: [] };
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    return { ok: false, msg: 'No internet connection.', models: [] };
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch('https://api.groq.com/openai/v1/models', {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + key },
      signal: ctrl.signal
    });
    if (!res.ok) {
      if (res.status === 401 || res.status === 403) {
        return { ok: false, msg: 'Invalid Groq API key', models: [] };
      }
      return { ok: false, msg: `Connection failed (HTTP ${res.status})`, models: [] };
    }
    const body = await res.json();
    const raw = Array.isArray(body.data) ? body.data.map(m => m && m.id).filter(Boolean) : [];
    const excludeRe = /whisper|orpheus|prompt-guard|safeguard/i;
    const visionRe = /qwen|vision|vl|muse/i;
    const filtered = raw.filter(id => !excludeRe.test(id));
    filtered.sort((a, b) => {
      const av = visionRe.test(a) ? 0 : 1;
      const bv = visionRe.test(b) ? 0 : 1;
      if (av !== bv) return av - bv;
      if (a === DEFAULT_MODEL) return -1;
      if (b === DEFAULT_MODEL) return 1;
      return a.localeCompare(b);
    });
    return { ok: true, msg: `Connected — ${filtered.length} models loaded`, models: filtered };
  } catch (err) {
    if (err && err.name === 'AbortError') return { ok: false, msg: 'Connection timed out after 15s.', models: [] };
    return { ok: false, msg: 'Network error: could not reach Groq API.', models: [] };
  } finally {
    clearTimeout(timer);
  }
}

async function loadGroqModelsForSettings(apiKey) {
  S.verifying = true;
  S.setDraft = { ...(S.setDraft || { apiKey, model: CFG.groqModel || DEFAULT_MODEL }), verifyMsg: 'Verifying key & loading models...', verifyOk: null };

    S.groqModels = res.models;

    }
  }

  render();
}

async function capturePhoto(source, onCaptured) {
  const cap = window.Capacitor;
  if (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Camera) {
    try {
      const photo = await cap.Plugins.Camera.getPhoto({
        source,
        resultType: 'dataUrl',
        quality: 90,
        allowEditing: false
      });
      if (photo && photo.dataUrl) {
        const viewUrl = await compressImageSource(photo.dataUrl, 1400, 0.80, false);
        const ocrUrl = await compressImageSource(photo.dataUrl, 900, 0.70, false);
        await onCaptured(viewUrl, ocrUrl);
      }
    } catch (err) {
      const msg = err && err.message ? err.message : '';
      if (!/cancel/i.test(msg)) toast('Could not capture photo');
    }
    return true;
  }
  return false;
}

async function shareOrDownloadFile(filename, content, mimeType) {
  const cap = window.Capacitor;
  if (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Filesystem && cap.Plugins.Share) {
    const { Filesystem, Share } = cap.Plugins;
    await Filesystem.writeFile({
      path: filename,
      data: content,
      directory: 'CACHE',
      encoding: 'utf8'
    });
    const uriRes = await Filesystem.getUri({ path: filename, directory: 'CACHE' });
    await Share.share({ title: filename, url: uriRes.uri });
  } else {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

function validateBackup(data) {
  if (!data || typeof data !== 'object') return false;
  if (!Array.isArray(data.accounts) || !Array.isArray(data.invoices)) return false;
  for (const a of data.accounts) {
    if (!a || typeof a.id !== 'number' || typeof a.name !== 'string') return false;
  }
  for (const i of data.invoices) {
    if (!i || typeof i.id !== 'number' || typeof i.accountId !== 'number' || typeof i.number !== 'string') return false;
    if (!Number.isInteger(i.amountSen) || !Array.isArray(i.payments)) return false;
  }
  return true;
}

async function restoreBackup(data) {
  await new Promise((resolve, reject) => {
    const tx = db.transaction(['accounts', 'invoices', 'settings'], 'readwrite');
    tx.objectStore('accounts').clear();
    tx.objectStore('invoices').clear();
    data.accounts.forEach(a => tx.objectStore('accounts').put(a));
    data.invoices.forEach(i => tx.objectStore('invoices').put(i));
    if (data.settings && typeof data.settings === 'object') {
      if (typeof data.settings.groqApiKey === 'string') {
        tx.objectStore('settings').put({ key: 'groqApiKey', value: data.settings.groqApiKey });
      }
      if (typeof data.settings.groqModel === 'string' && data.settings.groqModel.trim()) {
        tx.objectStore('settings').put({ key: 'groqModel', value: data.settings.groqModel.trim() });
      }
      ['lockEnabled', 'bioEnabled'].forEach(k => {
        if (typeof data.settings[k] === 'boolean') tx.objectStore('settings').put({ key: k, value: data.settings[k] });
      });
      ['pinHash', 'secQuestion', 'secAnswerHash'].forEach(k => {
        if (typeof data.settings[k] === 'string') tx.objectStore('settings').put({ key: k, value: data.settings[k] });
      });
    }
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  A = await dbGetAll('accounts');
  I = await loadInvoiceSummaries();
  CFG = await loadSettings();
  toast('Backup restored');
  go('home');
}

async function checkBiometricAvailable() {
  try {
    const nb = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NativeBiometric;
    if (!nb) { S.bioAvail = false; render(); return false; }
    const res = await nb.isAvailable({ useFallback: false });
    S.bioAvail = !!(res && res.isAvailable);
  } catch (err) {
    S.bioAvail = false;
  }
  if (S.v === 'security') render();
  return S.bioAvail;
}

async function triggerBiometricAuth() {
  const nb = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NativeBiometric;
  if (!nb) return false;
  try {
    await nb.verifyIdentity({
      reason: 'Unlock Invoice Tracker',
      title: 'Fingerprint Verification',
      subtitle: 'Verify your identity to continue',
      negativeButtonText: 'Use App PIN',
      useFallback: false
    });
    await onLockVerified();
    return true;
  } catch (err) {
    return false;
  }
}

function openLockPrompt(mode) {
  S.lockMode = mode;
  S.pinEntry = '';
  S.pinErr = '';
  S.forgotMode = false;
  S.forgotVerified = false;
  render();
  if (CFG.bioEnabled) {
    setTimeout(() => { if (S.lockMode === mode && !S.forgotMode) triggerBiometricAuth(); }, 180);
  }
}

async function onLockVerified() {
  const mode = S.lockMode;
  S.lockMode = null;
  S.pinEntry = '';
  S.pinErr = '';
  S.forgotMode = false;
  S.forgotVerified = false;
  if (mode === 'api') {
    return go('settings');
  }
  if (mode === 'disable') {
    await saveSetting('lockEnabled', false);
    await saveSetting('bioEnabled', false);
    toast('App Lock disabled');
    render();
    return;
  }
  if (mode === 'changepin') {
    S.secEditing = true;
    render();
    return;
  }
  render();
}

async function shareTextSummary(title, text) {
  const cap = window.Capacitor;
  if (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Share) {
    try { await cap.Plugins.Share.share({ title, text }); return; } catch (_) {}
  }
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; } catch (_) {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(text);
    toast('Summary copied to clipboard');
    return;
  }
  toast('Summary ready');
}

function buildAccountOpenShareText(accountId) {
  const a = acc(accountId);
  const invs = open(accountId).slice().sort((x, y) => x.dueDate < y.dueDate ? -1 : x.dueDate > y.dueDate ? 1 : 0);
  const lines = [
    `*Outstanding Invoices — ${a ? a.name : 'Account'}*`,
    `_Date: ${fmtDate(off(0))}_`,
    ''
  ];
  invs.forEach((i, idx) => {
    const pd = paidSen(i);
    const rem = balSen(i);
    const badge = pd > 0 ? 'Partial' : 'Unpaid';
    const amtStr = nFmt(i.amountSen);
    const pdStr = nFmt(pd);
    const remStr = nFmt(rem);
    const maxLen = Math.max(amtStr.length, pd > 0 ? pdStr.length : 0, remStr.length);
    const padNum = s => (s.length < maxLen ? ' '.repeat((maxLen - s.length) * 2) : '') + s;
    lines.push(`${idx + 1}. *${i.number}* [${badge}]`);
    lines.push(`   _Invoice Date: ${fmtDate(i.invoiceDate)}_`);
    lines.push('   ');
    lines.push(`   Invoice Amount: RM ${padNum(amtStr)}`);
    if (pd > 0) lines.push(`   Partially  Paid:     RM ${padNum(pdStr)}`);
    lines.push(`   Remaining Due:  *RM ${padNum(remStr)}*`);
    lines.push('');
  });
  lines.push(`_Total Outstanding Due:_ *${rm(dueSen(accountId))}*`);
  return lines.join('\n');
}

    return;
  }
  if (e.target.id === 'ph' && e.target.files && e.target.files[0]) {
    grab();
    try {
      const file = e.target.files[0];
      const viewUrl = await compressImageFile(file, 1400, 0.80);
      const ocrUrl = await compressImageFile(file, 900, 0.70);
      await processScannedImage(viewUrl, ocrUrl);
    } catch (err) {
      toast('Could not read image');
    }
  }
  if (e.target.id === 'eph' && e.target.files && e.target.files[0]) {
    try {
      S.sheetPhoto = await compressImageFile(e.target.files[0]);
      toast('Photo updated');
      render();
    } catch (err) {
      toast('Could not read image');
    }
  }
  if (e.target.id === 'rf' && e.target.files && e.target.files[0]) {
    try {
      const text = await e.target.files[0].text();
      const data = JSON.parse(text);
      if (!validateBackup(data)) return toast('Invalid backup file');
      if (!confirm(`Restore ${data.accounts.length} account(s) and ${data.invoices.length} invoice(s)? This replaces all current data.`)) return;
      await restoreBackup(data);
    } catch (err) {
      toast('Could not restore backup file');
    }
  }
});

// Full-screen zoom & pan gesture handling (pinch, double-tap, 1-finger drag)
let ZT = { mode: null, startDist: 0, startScale: 1, startX: 0, startY: 0, baseX: 0, baseY: 0, lastTap: 0 };
const applyZoomDOM = () => {
  const img = $('#zimg');
  if (img) img.style.transform = `translate(${S.zoomX}px,${S.zoomY}px) scale(${S.zoomScale})`;
  const rst = document.querySelector('[data-a="zoomreset"]');
  if (rst) rst.textContent = Math.round(S.zoomScale * 100) + '%';
};
document.addEventListener('touchstart', e => {
  if (!S.zoomOpen || !e.target.closest('#zstage')) return;
  if (e.touches.length === 2) {
    ZT.mode = 'pinch';
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    ZT.startDist = Math.hypot(dx, dy) || 1;
    ZT.startScale = S.zoomScale;
  } else if (e.touches.length === 1) {
    const now = Date.now();
    if (now - ZT.lastTap < 280) {
      e.preventDefault();
      if (S.zoomScale > 1.05) { S.zoomScale = 1; S.zoomX = 0; S.zoomY = 0; }
      else { S.zoomScale = 2.5; }
      applyZoomDOM();
      ZT.lastTap = 0;
      return;
    }
    ZT.lastTap = now;
    if (S.zoomScale > 1) {
      ZT.mode = 'pan';
      ZT.startX = e.touches[0].clientX;
      ZT.startY = e.touches[0].clientY;
      ZT.baseX = S.zoomX;
      ZT.baseY = S.zoomY;
    } else {
      ZT.mode = null;
    }
  }
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (!S.zoomOpen || !ZT.mode) return;
  if (ZT.mode === 'pinch' && e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy) || 1;
    S.zoomScale = Math.min(5, Math.max(1, +(ZT.startScale * (dist / ZT.startDist)).toFixed(2)));
    if (S.zoomScale === 1) { S.zoomX = 0; S.zoomY = 0; }
    applyZoomDOM();
  } else if (ZT.mode === 'pan' && e.touches.length === 1) {
    e.preventDefault();
    S.zoomX = ZT.baseX + (e.touches[0].clientX - ZT.startX);
    S.zoomY = ZT.baseY + (e.touches[0].clientY - ZT.startY);
    applyZoomDOM();
  }
}, { passive: false });
document.addEventListener('touchend', e => {
  if (e.touches.length === 0) ZT.mode = null;
});

// Android hardware Back button handling
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
  window.Capacitor.Plugins.App.addListener('backButton', () => {
    if (S.lockMode) {
      if (S.lockMode === 'unlock') {
        window.Capacitor.Plugins.App.exitApp();
      } else {
        S.lockMode = null; S.pinEntry = ''; S.pinErr = ''; S.forgotMode = false;
        render();
      }
    } else if (S.zoomOpen) {
      S.zoomOpen = false; S.zoomScale = 1; S.zoomX = 0; S.zoomY = 0;
      render();
    } else if (S.photoPrompt) {
      S.photoPrompt = null;
      render();
    } else if (S.sheet !== null) {
      S.sheet = null; S.sheetPhoto = null; S.editInv = false; S.confirmDelInv = null; S.confirmDelPay = null;
      render();
    } else if (S.v === 'acct') {
      go('accounts');
    } else if (['report', 'security', 'settings', 'about'].includes(S.v)) {
      go('more');
    } else if (S.v !== 'home') {
      go('home');
    } else {
      window.Capacitor.Plugins.App.exitApp();
    }
  });
}

(async () => {
  const sv = $('#splash-ver');
  if (sv) sv.textContent = APP_VERSION;
  const t0 = Date.now();
  try {
    db = await openDB();
    A = await dbGetAll('accounts');
    I = await loadInvoiceSummaries();
    CFG = await loadSettings();
    if (CFG.lockEnabled && CFG.pinHash) {
      S.lockMode = 'unlock';
    }
    render();
  } catch (err) {
    $('#app').innerHTML = '<p class="empty">Storage error: ' + esc(err && err.message ? err.message : err) + '</p>';
  } finally {
    const elapsed = Date.now() - t0;
    const wait = Math.max(0, 1250 - elapsed);
    setTimeout(() => {
      const sp = $('#splash');
      if (sp) {
        sp.classList.add('out');
        setTimeout(() => { sp.remove(); }, 400);
      }
      if (S.lockMode === 'unlock' && CFG.bioEnabled) {
        triggerBiometricAuth();
      }
    }, wait);
  }
})();
</script>
