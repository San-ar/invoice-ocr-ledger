<!doctype html>
<!-- UI REFERENCE PROTOTYPE (approved design). Sample data only: nothing is saved and scanning is simulated. See PRD.md for the real behaviour. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light">
<title>Invoice Tracker</title>
<style>
:root{--bg:#eefaf4;--ink:#0d2a20;--mut:#587068;--card:#fff;--line:#cfe3d9;--g1:#0fa874;--g2:#066b4a;--bal:#066b4a;--ga:rgba(20,184,128,.30);--gb:rgba(20,184,128,.10);--red:#c0281f;--amb:#8a5a00;--gold:linear-gradient(135deg,#fbeaa0,#d9a516 28%,#fff3b8 48%,#c8961a 70%,#8f6a10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button,input{font:inherit;color:var(--ink)}button{cursor:pointer}
#app{max-width:430px;margin:auto;min-height:100vh;background:radial-gradient(circle at 92% 12%,rgba(40,210,150,.35),transparent 42%),radial-gradient(circle at 0% 55%,rgba(217,165,22,.18),transparent 38%),var(--bg);padding-bottom:90px;position:relative}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;padding:16px;border-style:solid;border-width:0 0 4px;border-image:var(--gold) 1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1{margin:0;font-size:20px;font-weight:700}.hd button{min-height:44px;padding:0 16px;background:rgba(255,255,255,.16);border:1.5px solid #e8c24a;color:#fff;border-radius:22px;font-weight:600}
.tr{text-align:right;font-weight:600}.tr small{display:block;font-size:12px}.tr b{font-size:20px;color:#ffe58a}
main{padding:14px 16px}
.mod{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;height:68px;padding:8px 16px;margin-bottom:10px;border-radius:18px;border:2px solid transparent;background:linear-gradient(165deg,var(--g1),var(--g2)) padding-box,var(--gold) border-box;color:#fff;text-align:left}
.mod::after{content:"";position:absolute;left:-30%;top:-60%;width:160%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0));transform:rotate(-8deg);pointer-events:none}
.ic{position:relative;z-index:1;flex:none;width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:linear-gradient(#08865c,#08865c) padding-box,var(--gold) border-box;display:flex;align-items:center;justify-content:center}
.mod span{position:relative;z-index:1}.mod b{font-size:18px;display:block}.mod small{font-size:13px;font-weight:600;color:#e6fff3}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bal);margin:16px 0 10px;padding-bottom:5px;border-style:solid;border-width:0 0 2px;border-image:var(--gold) 1}
.ac{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border-radius:22px;border:1.5px solid rgba(15,168,116,.5);background:linear-gradient(135deg,var(--ga),var(--gb));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 22px rgba(6,107,74,.2),inset 0 1px 0 rgba(255,255,255,.8)}
.av{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:linear-gradient(145deg,var(--g1),var(--g2)) padding-box,var(--gold) border-box;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.ac .nm{flex:1}.ac small{display:block;color:var(--mut);font-size:13px}.amt{font-weight:700;font-size:17px;text-align:right}
.iv{position:relative;overflow:hidden;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.iv::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:6px}.ih b{font-size:16px}.ih small{margin-left:auto;color:var(--mut);font-size:12px}
.sl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.bl{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.bl span{font-size:13px;font-weight:700;color:var(--ink)}.bl strong{font-size:26px;line-height:1.1;color:var(--bal)}.bl .red{color:var(--red)}
.tag{font-size:12px;font-weight:600;padding:1px 9px;border-radius:10px;border:1px solid var(--mut);color:var(--mut)}
.tag.o{color:var(--red);border-color:var(--red)}.tag.p{color:var(--amb);border-color:#c8961a}.tag.d{color:var(--bal);border-color:var(--g1)}
.btn{display:block;width:100%;min-height:50px;border-radius:14px;border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--gold) border-box;color:var(--bal);font-weight:700;margin:8px 0}
.btn.f{background:linear-gradient(160deg,var(--g1),var(--g2)) padding-box,var(--gold) border-box;color:#fff}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.sum div{padding:10px 14px;border-radius:16px;border:1.5px solid rgba(15,168,116,.5);background:linear-gradient(135deg,var(--ga),var(--gb))}.sum small{display:block;color:var(--mut);font-size:13px}.sum b{font-size:19px}
.chips{display:flex;gap:6px;margin:6px 0 12px}.chips button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:13px}.chips .on{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;border-color:#e8c24a}
label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:0 0 12px}
input{display:block;width:100%;min-height:48px;margin-top:5px;padding:0 12px;border:2px solid var(--g2);border-radius:12px;background:#fff;font-size:16px;font-weight:600;box-shadow:0 2px 6px rgba(6,107,74,.15)}input:focus{outline:none;border-color:#d9a516;box-shadow:0 0 0 3px rgba(217,165,22,.35)}
.row{display:flex;gap:8px;align-items:flex-end}.row>label{flex:1;margin:0}.row .btn{width:auto;padding:0 14px;margin:0;font-size:14px}
#al{position:absolute;left:16px;right:16px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.2);display:none;overflow:hidden}
#al button{display:block;width:100%;min-height:46px;text-align:left;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:none}#al p{margin:0;padding:12px 14px;color:var(--mut);font-size:14px}
.note{padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,var(--ga),var(--gb));font-size:13px;margin:0 0 12px}
.fab{position:fixed;right:max(18px,calc(50% - 197px));bottom:calc(22px + env(safe-area-inset-bottom,0px));min-height:56px;padding:0 22px;border-radius:28px;border:2px solid transparent;background:linear-gradient(160deg,var(--g1),var(--g2)) padding-box,var(--gold) border-box;color:#fff;font-weight:700;box-shadow:0 10px 22px rgba(6,80,58,.4);z-index:4}
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto}
.sh{width:100%;max-width:430px;margin:0 auto;min-height:100%;background:radial-gradient(circle at 92% 6%,rgba(40,210,150,.3),transparent 40%),var(--bg);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sh .hd{margin:0 -16px 14px}
.ph{height:230px;border-radius:12px;background:#e9ecea;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.pp{width:46%;height:92%;background:#fff;transform:rotate(-3deg);box-shadow:0 4px 12px rgba(0,0,0,.25);padding:8px;color:#333;font-size:9px}.pp i{display:block;height:4px;background:#c9cfcc;margin:5px 0}.pp u{display:block;text-align:right;font-weight:700;margin-top:8px}
.dl{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-bottom:1px solid var(--line)}.dl.s{font-size:13px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:22px 0}
.st{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:16px 8px 6px;margin-top:4px}.st::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--gold)}
.st h3{margin:0;text-align:center;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--bal)}.st .sub{text-align:center;font-size:13px;color:var(--mut);margin:2px 0 10px}
.sr{display:grid;grid-template-columns:60px 1fr 66px 66px 70px;gap:4px;width:100%;text-align:left;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:none;font-size:12px;align-items:center}.sr b{font-size:13px;display:block}.sr small{display:block;color:var(--mut);font-size:12px}.sr .n{text-align:right;font-variant-numeric:tabular-nums}.sr .g{color:var(--bal);font-weight:700}.sr .bb{font-weight:700;font-size:13px}
.sr.hdr{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;font-weight:700;border-radius:6px;padding:9px 4px;border:0}.sr.tot{font-weight:700;font-size:13px;border-bottom:0;border-top:2px solid var(--g2);margin-top:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:30}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script>
const T=new Date();T.setHours(0,0,0,0);
const fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const off=o=>{const d=new Date(T);d.setDate(d.getDate()+o);return fd(d)};
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const show=s=>{const [y,m,d]=s.split('-');return +d+' '+MO[m-1]+' '+y};
const days=s=>Math.round((new Date(s+'T00:00')-T)/864e5);
const rm=n=>'RM '+(+n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
let A=[[1,'Ah Seng Hardware','012-345 6789'],[2,'Kedai Runcit Mei Ling','013-221 8890'],[3,'Bina Jaya Contractor','019-776 1234'],[4,'Restoran Selera Kampung','011-2345 6677'],[5,'Nur Auto Workshop','016-880 4521'],[6,'Tan Electrical','017-662 3109']].map(([id,name,ph])=>({id,name,ph}));
let nid=100;
let I=[[1,'A-1042',-45,-15,1850,[[-8,500]]],[1,'A-1067',-20,10,920,[]],[2,'A-1050',-35,-5,3400,[]],[2,'A-1071',-10,20,640,[]],[3,'A-1033',-60,-30,7200,[[-30,3000]]],[3,'A-1075',-8,22,2150,[]],[3,'A-1009',-160,-130,1800,[[-135,1000],[-120,800]]],[4,'A-1058',-25,5,1380,[]],[5,'A-1062',-18,12,560,[]],[6,'A-1077',-5,25,2900,[]]].map(([acc,no,i,d,amt,p],k)=>({id:k+1,acc,no,iss:off(i),due:off(d),amt,pay:p.map(([x,a])=>({d:off(x),a}))}));
const paid=i=>i.pay.reduce((t,p)=>t+p.a,0),bal=i=>Math.max(0,i.amt-paid(i));
const st=i=>bal(i)<=0?'d':days(i.due)<0?'o':paid(i)>0?'p':'u';
const TAG={d:'Paid',o:'Overdue',p:'Partly paid',u:'Unpaid'};
const mine=a=>I.filter(i=>i.acc==a),open=a=>mine(a).filter(i=>bal(i)>0);
const due=a=>open(a).reduce((t,i)=>t+bal(i),0);
const acc=id=>A.find(a=>a.id==id);
let S={v:'home',acc:null,hf:'all',exp:{},sheet:null,add:false,d:{}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)};
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const dueTxt=i=>{const d=days(i.due);return bal(i)<=0?'Paid in full':d<0?-d+(d==-1?' day':' days')+' overdue':d==0?'Due today':'Due in '+d+' days'};

const accCard=(a,act)=>`<button class=ac data-a=${act} data-id=${a.id}><span class=av>${esc(ini(a.name))}</span><span class=nm><b>${esc(a.name)}</b><small>${open(a.id).length} open invoice${open(a.id).length==1?'':'s'}</small></span><span class=amt>${rm(due(a.id))}</span></button>`;
const inv=i=>{const s=st(i);return `<button class=iv data-a=sheet data-id=${i.id}><div class=ih><b>${esc(i.no)}</b><span class="tag ${s=='u'?'':s}">${TAG[s]}</span><small>${dueTxt(i)}</small></div>
<div class=sl><span>Invoice value</span><span>${rm(i.amt)}</span></div><div class=sl><span>Paid so far</span><span>${rm(paid(i))}</span></div>
<div class=bl><span>Balance</span><strong class="${s=='o'?'red':''}">${rm(bal(i))}</strong></div></button>`};
const IC={tray:'<path d="M4 13l3-8h10l3 8v6H4zM4 13h5l1 2h4l1-2h5"/>',plus:'<path d="M12 5v14M5 12h14"/>',ppl:'<circle cx="9" cy="9" r="3"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M16 6a3 3 0 010 6M18 14c2 1 3 3 3 6"/>'};
const mod=(v,ic,t,s)=>`<button class=mod data-a=go data-v=${v}><span class=ic><svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke="#f3d36b" stroke-width=2 aria-hidden=true>${IC[ic]}</svg></span><span><b>${t}</b><small>${s}</small></span></button>`;
const bar=(t,r)=>`<div class=hd><h1>${t}</h1>${r}</div>`;
const back=(v,l)=>`<button data-a=go data-v=${v}>${l}</button>`;
const addForm=()=>`<div class=ac style="display:block;border-radius:18px"><label>Account name<input id=an></label><label>Phone (optional)<input id=ap inputmode=tel></label><button class="btn f" data-a=saveacc>Save account</button></div>`;

function home(){const tot=I.reduce((t,i)=>t+bal(i),0),l=A.filter(a=>due(a.id)>0).sort((x,y)=>due(y.id)-due(x.id));
return bar('Invoice Tracker',`<div class=tr><small>To receive</small><b>${rm(tot)}</b></div>`)+`<main>${mod('new','plus','New Entry','Add an invoice')}${mod('received','tray','Received','Mark payments')}${mod('accounts','ppl','Accounts','Statements and accounts')}<h2>Highest dues</h2>${l.map(a=>accCard(a,'acct')).join('')}</main>`}
const recList=()=>{const l=A.filter(a=>open(a.id).length&&a.name.toLowerCase().includes((S.q||'').toLowerCase())).sort((x,y)=>due(y.id)-due(x.id));return l.map(a=>accCard(a,'exp')+(S.exp[a.id]?`<div style="margin:-2px 0 6px 14px">${open(a.id).sort((x,y)=>x.due<y.due?-1:1).map(inv).join('')}</div>`:'')).join('')||'<p class=empty>No matching accounts.</p>'};
function received(){
return bar('Received',back('home','Home'))+`<main><label>Search accounts<input id=rq autocomplete=off placeholder="Type an account name" value="${esc(S.q||'')}"></label><div id=rl>${recList()}</div></main>`}
function accounts(){return bar('Accounts',back('home','Home'))+`<main><button class="btn f" data-a=toggleadd style="margin-top:0">+ Add account</button>${S.add?addForm():''}<h2>Tap an account for its statement</h2>${A.slice().sort((x,y)=>x.name<y.name?-1:1).map(a=>accCard(a,'acct')).join('')}</main>`}
function stmt(){const a=acc(S.acc),all=mine(a.id);
const tot=all.reduce((t,i)=>t+i.amt,0),pd=all.reduce((t,i)=>t+paid(i),0);
const ev=[];all.forEach(i=>{ev.push({d:i.iss,k:0,i});i.pay.forEach(p=>ev.push({d:p.d,k:1,i,a:p.a}))});
ev.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:x.k-y.k);
const n=v=>(+v).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}),sd=s=>{const [y,m,d]=s.split('-');return +d+' '+MO[m-1]+' '+y.slice(2)};
let run=0;const rows=ev.map(e=>{run+=e.k?-e.a:e.i.amt;return e.k?`<button class="sr" data-a=sheet data-id=${e.i.id}><span>${sd(e.d)}</span><span><b>Payment</b><small>for ${esc(e.i.no)}</small></span><span class=n></span><span class="n g">${n(e.a)}</span><span class="n bb">${n(run)}</span></button>`:`<button class=sr data-a=sheet data-id=${e.i.id}><span>${sd(e.d)}</span><span><b>${esc(e.i.no)}</b><small>Due ${sd(e.i.due)}</small></span><span class=n>${n(e.i.amt)}</span><span class=n></span><span class="n bb">${n(run)}</span></button>`}).join('');
return bar(esc(a.name),back('accounts','Back'))+`<main><p style="margin:0 0 10px;color:var(--mut)">${esc(a.ph)}</p><div class=sum><div><small>Total invoiced</small><b>${rm(tot)}</b></div><div><small>Still owing</small><b>${rm(tot-pd)}</b></div></div>
<div class=st><h3>Statement of account</h3><div class=sub>${esc(a.name)} · as at ${show(off(0))}</div><div class="sr hdr"><span>Date</span><span>Details</span><span class=n>Invoice</span><span class=n>Received</span><span class=n>Balance</span></div>${rows||'<p class=empty>No invoices yet.</p>'}<div class="sr tot"><span></span><span>Totals (RM)</span><span class=n>${n(tot)}</span><span class="n g">${n(pd)}</span><span class="n bb">${n(tot-pd)}</span></div></div></main><button class=fab data-a=newfor>+ New invoice</button>`}
function newEntry(){const d=S.d,a=d.acc?acc(d.acc):null;
return bar('New Entry',back('home','Home'))+`<main><div class=row><label>Account (type to search)<input id=as autocomplete=off placeholder="Start typing a name" value="${esc(a?a.name:'')}"></label><button class="btn f" data-a=toggleadd2>+ New account</button></div><div id=al></div>${S.add?'<div style="height:10px"></div>'+addForm():''}
<label class=btn style="display:block;text-align:center;line-height:46px;margin-top:14px">Scan invoice photo (auto-fill)<input type=file accept="image/*" capture=environment hidden id=ph></label>
${d.img?`<div class=ph><img alt="Invoice photo" src="${d.img}"></div><p class=note>Invoice number, dates and amount were filled from the photo. Please check them. The account is never read from the photo, so choose it above.</p>`:''}
<label>Invoice number<input id=ni value="${esc(d.no||'')}"></label><label>Invoice date<input type=date id=nd value="${d.iss||off(0)}"></label><label>Due date<input type=date id=nu value="${d.due||off(30)}"></label>
<label>Amount (RM)<input type=number step=0.01 inputmode=decimal id=nm value="${esc(d.amt||'')}"></label><button class="btn f" data-a=saveinv>Save invoice</button></main>`}
function sheet(){const i=I.find(x=>x.id==S.sheet);if(!i)return'';const b=bal(i),s=st(i);
return `<div class=ov data-a=closesheet><div class=sh><div class=hd><h1>Invoice</h1><button data-a=closesheet>Back</button></div>
<div class=ph>${i.img?`<img alt="Invoice photo" src="${i.img}">`:`<div class=pp><b>INVOICE ${esc(i.no)}</b><i></i><i></i><i></i><i></i><u>${rm(i.amt)}</u></div>`}</div>
<div style="display:flex;align-items:center;gap:8px"><b style="font-size:21px">${esc(i.no)}</b><span class="tag ${s=='u'?'':s}">${TAG[s]}</span></div><div style="color:var(--mut);margin-bottom:8px">${esc(acc(i.acc).name)}</div>
<div class=dl><span>Invoice date</span><span>${show(i.iss)}</span></div><div class=dl><span>Due date</span><span>${show(i.due)}</span></div>
<div class=dl><span>Invoice value</span><span>${rm(i.amt)}</span></div>${i.pay.map(p=>`<div class="dl s"><span>Received ${show(p.d)}</span><span>${rm(p.a)}</span></div>`).join('')}
<div class=bl style="border:0"><span>Balance</span><strong class="${s=='o'?'red':''}">${rm(b)}</strong></div>
${b>0?`<button class="btn f" data-a=payfull data-id=${i.id}>Fully paid &nbsp;${rm(b)}</button><div class=row style="margin-top:6px"><label>Partial payment (RM)<input id=pa type=number step=0.01 inputmode=decimal></label><button class=btn data-a=paypart data-id=${i.id}>Record</button></div>`:'<p class=note>This invoice is fully paid.</p>'}
<button class=btn data-a=closesheet>Close</button></div></div>`}

const VIEWS={home,received,accounts,acct:stmt,new:newEntry};
const render=()=>{$('#app').innerHTML=VIEWS[S.v]()+sheet()};
const go=(v,a)=>{S.v=v;S.q='';if(a!==undefined)S.acc=a;S.add=false;S.sheet=null;scrollTo(0,0);render()};
const grab=()=>{if($('#ni'))S.d={...S.d,no:$('#ni').value,iss:$('#nd').value,due:$('#nu').value,amt:$('#nm').value}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
if(a=='closesheet'&&e.target!==b)return;
if(a=='go'){if(b.dataset.v=='new')S.d={};return go(b.dataset.v)}
if(a=='acct')return go('acct',id);
if(a=='pick'){S.d.acc=id;$('#as').value=acc(id).name;$('#al').style.display='none';return}
if(a=='exp')S.exp[id]=!S.exp[id];
else if(a=='sheet')S.sheet=id;
else if(a=='closesheet')S.sheet=null;
else if(a=='newfor'){S.d={acc:S.acc};return go('new')}
else if(a=='hf')S.hf=b.dataset.k;
else if(a=='toggleadd')S.add=!S.add;
else if(a=='toggleadd2'){grab();S.add=!S.add}
else if(a=='saveacc'){const n=$('#an').value.trim();if(!n)return toast('Enter the account name');grab();const x={id:++nid,name:n,ph:$('#ap').value.trim()};A.push(x);S.add=false;if(S.v=='new')S.d.acc=x.id;toast('Account added')}
else if(a=='saveinv'){grab();const d=S.d;if(!d.acc)return toast('Choose an account first');if(!d.no||!(+d.amt>0))return toast('Enter invoice number and amount');I.push({id:++nid,acc:+d.acc,no:d.no,iss:d.iss,due:d.due,amt:+d.amt,img:d.img,pay:[]});toast('Invoice saved');return go('acct',+d.acc)}
else if(a=='payfull'){const i=I.find(x=>x.id==id);i.pay.push({d:off(0),a:bal(i)});toast('Fully paid')}
else if(a=='paypart'){const i=I.find(x=>x.id==id),v=+$('#pa').value;if(!(v>0))return toast('Enter the amount received');if(v>bal(i))return toast('That is more than the balance');i.pay.push({d:off(0),a:v});toast('Payment recorded')}
render()});
const list=q=>{const l=$('#al');if(!l)return;const m=A.filter(a=>a.name.toLowerCase().includes(q.toLowerCase())).slice(0,6);l.style.display='block';l.style.top=($('#as').getBoundingClientRect().bottom+scrollY+4)+'px';
l.innerHTML=m.map(a=>`<button data-a=pick data-id=${a.id}>${esc(a.name)}</button>`).join('')||'<p>No match. Tap + New account to add it.</p>'};
document.addEventListener('input',e=>{if(e.target.id=='as'){S.d.acc=null;list(e.target.value)}if(e.target.id=='rq'){S.q=e.target.value;$('#rl').innerHTML=recList()}});
document.addEventListener('focusin',e=>{if(e.target.id=='as')list(e.target.value)});
document.addEventListener('click',e=>{if(!e.target.closest('#as,#al')&&$('#al'))$('#al').style.display='none'});
document.addEventListener('change',e=>{if(e.target.id=='ph'&&e.target.files[0]){grab();S.d={...S.d,img:URL.createObjectURL(e.target.files[0]),no:'A-'+(1080+I.length),amt:1250,iss:off(0),due:off(30)};render()}});
render();
</script></body></html>
